name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jdk-sbt
      - name: Run tests
        run: sbt test

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jdk-sbt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build fat jar with UI
        env:
          # Create React App treats lint warnings as errors when CI=true.
          CI: "false"
        run: sbt "service/packageService"
      - uses: actions/upload-artifact@v4
        with:
          name: ttk-service
          path: service/target/scala-*/service-assembly-*.jar
          if-no-files-found: error
          retention-days: 14

  dependency-graph:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jdk-sbt
      - uses: scalacenter/sbt-dependency-submission@v2
