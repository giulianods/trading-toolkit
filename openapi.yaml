openapi: 3.0.3
info:
  title: Trading Toolkit Service API
  version: 1.0.0
  description: |
    Canonical data routes are `/markets/{country}/{provider}/...`.
    The provider path segment is a configured market-profile key; GET /markets
    lists the actual price, listings, financials, and metadata sources.
    Canada EODHD uses `/markets/ca/eodhd/...` with exchange-qualified tickers
    such as `RY.TO` (TSX) and `AAG.V` (TSX Venture).
    Unprefixed `/quotes`, `/financials`, `/watchlists`, `/description`, `/descriptions`, and `/breadth`
    paths alias to the US Massive market (`us` / `massive`). `/status` is process-wide.
servers:
  - url: http://localhost:7777
    description: Local development server
tags:
  - name: Status
  - name: Quotes
  - name: Financials
  - name: Watchlists
  - name: Metadata
  - name: Breadth
  - name: MCP
paths:
  /markets/{country}/{provider}/reports:
    parameters:
      - $ref: '#/components/parameters/CountryParam'
      - $ref: '#/components/parameters/ProviderParam'
    get:
      tags: [Reports]
      summary: Read market reports newest publication first
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: offset
          in: query
          description: Number of reports to skip when browsing older publications
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      responses:
        '200':
          description: Latest reports including Markdown content
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/MarketReport'}
    post:
      tags: [Reports]
      summary: Publish an agent-written Markdown market report
      description: Reports are stored in the selected market profile. createdAt is assigned by the server; asOf is the date covered by the report.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportInput'}
      responses:
        '201':
          description: Published report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketReport'}
        '400': {$ref: '#/components/responses/BadRequestText'}
  /markets/{country}/{provider}/reports/{id}:
    parameters:
      - $ref: '#/components/parameters/CountryParam'
      - $ref: '#/components/parameters/ProviderParam'
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Reports]
      summary: Read one published market report
      responses:
        '200':
          description: Published report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketReport'}
        '404': {description: Report or market not found}
  /markets/{country}/{provider}/portfolio:
    parameters:
      - $ref: '#/components/parameters/CountryParam'
      - $ref: '#/components/parameters/ProviderParam'
    get:
      tags: [Portfolio]
      summary: Read paper portfolio balances, positions, equity history and trade activity
      description: |
        Each market profile starts with 100000 in local currency (RON for Romania,
        USD for US, CAD for Canada). Cash-only, long-only, average cost accounting.
        Positions use the latest stored close on or after their last fill date,
        falling back to the last fill price with priceSource=last_fill and null quoteDate.
        History uses only fills and closes on or before each UTC date, including an
        initial-capital point before the first fill. No broker orders are submitted.
      responses:
        '200':
          description: Portfolio snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortfolioView'}
  /markets/{country}/{provider}/portfolio/trades:
    parameters:
      - $ref: '#/components/parameters/CountryParam'
      - $ref: '#/components/parameters/ProviderParam'
    post:
      tags: [Portfolio]
      summary: Record an executed paper buy or sell
      description: |
        Submit fills in chronological order. Use a stable unique id for retries.
        Identical retries return 200; conflicting ids return 409. Concurrent requests
        use optimistic locking. Buys require sufficient cash and sells sufficient shares.
        Future executions, invalid values and more than eight decimal places are rejected.
        Fees are in account currency; buy fees increase cost basis and sell fees reduce realized P/L.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PortfolioTrade'}
      responses:
        '201':
          description: Recorded fill
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortfolioTrade'}
        '200':
          description: Identical fill was already recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortfolioTrade'}
        '400': {$ref: '#/components/responses/BadRequestText'}
        '409': {description: Conflicting trade id or concurrent update; retry with the same id}
  /mcp:
    post:
      tags: [MCP]
      summary: MCP Streamable HTTP JSON-RPC endpoint
      description: |
        Stateless MCP transport (2025-11-25, 2025-06-18, 2025-03-26).
        Supports initialize, ping, tools/list, tools/call and notifications.
        Each REST operation below is exposed as a tool generated from this contract.
        Send Content-Type application/json and Accept application/json, text/event-stream.
        No session ID is issued. When supplied, MCP-Protocol-Version must be supported.
        Origin, when present, must be explicitly allowed by ttk.mcp.allowed.origins
        (defaults to localhost, 127.0.0.1 and [::1] on HTTP port 7777).
        Tool results contain status and body; REST errors set isError to true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: JSON-RPC result or error
          content:
            application/json:
              schema:
                type: object
        '202':
          description: Notification accepted (empty body)
        '400':
          description: Invalid JSON-RPC envelope or unsupported protocol version
        '403':
          description: Origin rejected
        '406':
          description: Accept must include application/json and text/event-stream
        '415':
          description: Content-Type must be application/json
    get:
      tags: [MCP]
      summary: No standalone SSE stream is offered
      responses:
        '405':
          description: Method not allowed (stateless JSON responses only)
    delete:
      tags: [MCP]
      summary: No MCP sessions to terminate
      responses:
        '405':
          description: Method not allowed (no sessions)
  /status:
    get:
      tags: [Status]
      summary: Process health, Mongo ping, and cron job snapshots
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStatus'
  /markets:
    get:
      tags: [Metadata]
      summary: List configured market profiles and their data sources
      responses:
        '200':
          description: Enabled profiles in configuration order, including legacy route aliases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketProfile'
  /markets/screens:
    get:
      tags: [Watchlists]
      summary: List enabled screens in display order
      responses:
        '200':
          description: Screen choices shared by all enabled markets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id:
                      type: string
                      example: 7_PCT_UP
                    label:
                      type: string
                      example: 7%UP
  /markets/{country}/{provider}/data-status:
    get:
      tags: [Quotes]
      summary: Get the latest stored quote session date
      parameters:
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/ProviderParam'
      responses:
        '200':
          description: Latest stored quote date, or null when no quotes are stored
          content:
            application/json:
              schema:
                type: object
                required: [latestQuoteDate]
                properties:
                  latestQuoteDate:
                    type: string
                    format: date
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFoundText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /markets/{country}/{provider}/quotes/{ticker}:
    get:
      tags: [Quotes]
      summary: Get daily quote data for a ticker
      parameters:
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/ProviderParam'
        - $ref: '#/components/parameters/TickerParam'
        - $ref: '#/components/parameters/QuotesFormatParam'
      responses:
        '200':
          $ref: '#/paths/~1quotes~1{ticker}/get/responses/200'
        '400':
          $ref: '#/components/responses/BadRequestText'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /markets/{country}/{provider}/income-statements/{ticker}:
    get:
      tags: [Financials]
      summary: Get annual and quarterly income statement totals and reported EPS
      description: >-
        Profiles selecting Finnhub financials share cached as-reported statements populated during initialization
        and scheduled refreshes, independently of their price provider. Profiles selecting
        EODHD load statements on demand; none returns empty periods. No provider credentials are returned.
      parameters:
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/ProviderParam'
        - $ref: '#/components/parameters/TickerParam'
      responses:
        '200':
          description: Statement periods in date order, or empty arrays when unavailable
          content:
            application/json:
              schema:
                type: object
                required: [annual, quarterly]
                properties:
                  annual:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncomePeriod'
                  quarterly:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncomePeriod'
        '400':
          $ref: '#/components/responses/BadRequestText'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /markets/{country}/{provider}/financials:
    get:
      tags: [Financials]
      summary: Get financial data for one or more tickers
      parameters:
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/ProviderParam'
        - name: tickers
          in: query
          required: true
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/paths/~1financials/get/responses/200'
        '400':
          $ref: '#/components/responses/BadRequestText'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /markets/{country}/{provider}/watchlists/history:
    get:
      tags: [Watchlists]
      summary: Get watchlist history by day
      parameters:
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/ProviderParam'
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          $ref: '#/paths/~1watchlists~1history/get/responses/200'
        '400':
          $ref: '#/components/responses/BadRequestText'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /markets/{country}/{provider}/watchlists/{name}:
    get:
      tags: [Watchlists]
      summary: Get one watchlist by name
      parameters:
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/ProviderParam'
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: vcp
        - name: day
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          $ref: '#/paths/~1watchlists~1{name}/get/responses/200'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /markets/{country}/{provider}/descriptions:
    get:
      tags: [Metadata]
      summary: Get company name and sector for chart headers
      description: |
        Returns a map keyed by ticker. Tickers with no stored description are omitted.
        `sector` is the SIC description when the provider supplies one, otherwise an empty string.
        Each profile uses its configured metadata source. Massive reference metadata is shared from its existing cache, without external API requests.
        At most 500 tickers per request.
      parameters:
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/ProviderParam'
        - name: tickers
          in: query
          required: true
          description: Comma-separated tickers, e.g. `AAPL,MSFT`.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/paths/~1descriptions/get/responses/200'
        '400':
          $ref: '#/components/responses/BadRequestText'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /markets/{country}/{provider}/description/{ticker}:
    get:
      tags: [Metadata]
      summary: Get stock description metadata
      description: Reads the profile's configured metadata source. Massive company metadata is shared from its existing cache while listing identity remains specific to the price profile. No external API request is made.
      parameters:
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/ProviderParam'
        - $ref: '#/components/parameters/TickerParam'
      responses:
        '200':
          $ref: '#/paths/~1description~1{ticker}/get/responses/200'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /markets/{country}/{provider}/breadth/indicators:
    get:
      tags: [Breadth]
      summary: Get market breadth indicators
      parameters:
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/ProviderParam'
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
      responses:
        '200':
          $ref: '#/paths/~1breadth~1indicators/get/responses/200'
        '400':
          $ref: '#/components/responses/BadRequestText'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /quotes/{ticker}:
    get:
      tags: [Quotes]
      summary: Get daily quote data for a ticker
      deprecated: true
      description: |
        Alias for `/markets/us/massive/quotes/{ticker}`.
        Returns quote history as JSON by default.
        If request header `Accept: text/csv` is set, returns CSV text.
      parameters:
        - $ref: '#/components/parameters/TickerParam'
        - $ref: '#/components/parameters/QuotesFormatParam'
      responses:
        '200':
          description: Quote data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyQuoteData'
              examples:
                sample:
                  value:
                    quotes:
                      - day: '2026-02-23'
                        o: 190.1
                        h: 193.4
                        l: 189.7
                        c: 192.8
                        v: 61002000
                      - day: '2026-02-24'
                        o: 192.6
                        h: 194.0
                        l: 191.3
                        c: 193.1
                        v: 52034000
            text/csv:
              schema:
                type: string
              examples:
                sample:
                  value: |
                    date,open,high,low,close,volume
                    2026-02-23,190.1,193.4,189.7,192.8,61002000
                    2026-02-24,192.6,194.0,191.3,193.1,52034000
        '400':
          $ref: '#/components/responses/BadRequestText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /financials:
    get:
      tags: [Financials]
      summary: Get financial data for one or more tickers
      deprecated: true
      description: Alias for `/markets/us/massive/financials`.
      parameters:
        - name: tickers
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated tickers, e.g. `AAPL,MSFT`.
        - name: category
          in: query
          required: false
          schema:
            type: string
            example: annual,quarterly
          description: |
            Comma-separated filter. Allowed values are `annual` and `quarterly`.
            Defaults to both.
      responses:
        '200':
          description: Financial data keyed by ticker symbol
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/StockFinancials'
              examples:
                sample:
                  value:
                    AAPL:
                      ticker: AAPL
                      annual:
                        - year: 2024
                          revenuePerShare: 26.4
                          basicEarningsPerShare: 6.2
                          operatingMargin: 0.29
                          netIncomeMargin: 0.25
                      quarterly:
                        - quarter: 4
                          year: 2025
                          revenuePerShare: 6.7
                          basicEarningsPerShare: 1.6
                          netIncomeMargin: 0.24
                          operatingMargin: 0.28
                    MSFT:
                      ticker: MSFT
                      annual: []
                      quarterly:
                        - quarter: 3
                          year: 2025
                          revenuePerShare: 8.3
                          basicEarningsPerShare: 2.7
                          netIncomeMargin: 0.34
                          operatingMargin: 0.43
        '400':
          $ref: '#/components/responses/BadRequestText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /watchlists/history:
    get:
      tags: [Watchlists]
      summary: Get watchlist history by day
      deprecated: true
      description: Alias for `/markets/us/massive/watchlists/history`.
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Historical watchlist summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchlistHistoryEntry'
              examples:
                sample:
                  value:
                    - day: '2026-02-24'
                      watchlists:
                        - name: vcp
                          symbolCount: 12
                        - name: sepa
                          symbolCount: 9
                    - day: '2026-02-25'
                      watchlists:
                        - name: vcp
                          symbolCount: 10
        '400':
          $ref: '#/components/responses/BadRequestText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /watchlists/{name}:
    get:
      tags: [Watchlists]
      summary: Get one watchlist by name
      deprecated: true
      description: Alias for `/markets/us/massive/watchlists/{name}`.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: vcp
        - name: day
          in: query
          required: false
          schema:
            type: string
            format: date
          description: If omitted, latest watchlist is returned.
      responses:
        '200':
          description: Watchlist payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watchlist'
              examples:
                sample:
                  value:
                    day: '2026-02-25'
                    screenName: vcp
                    tickers: [AAPL, MSFT, NVDA]
                    stats:
                      - ticker: AAPL
                        stats:
                          breakoutScore: '78'
                          rsRank: '92'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /descriptions:
    get:
      tags: [Metadata]
      summary: Get company name and sector for chart headers
      deprecated: true
      description: Alias for `/markets/us/massive/descriptions`.
      parameters:
        - name: tickers
          in: query
          required: true
          description: Comma-separated tickers, e.g. `AAPL,MSFT`.
          schema:
            type: string
      responses:
        '200':
          description: Labels keyed by ticker symbol
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ChartLabel'
              examples:
                sample:
                  value:
                    AAPL:
                      companyName: Apple Inc.
                      sector: Electronic Computers
                    MSFT:
                      companyName: Microsoft Corporation
                      sector: ''
        '400':
          $ref: '#/components/responses/BadRequestText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /description/{ticker}:
    get:
      tags: [Metadata]
      summary: Get stock description metadata
      deprecated: true
      description: Alias for `/markets/us/massive/description/{ticker}`.
      parameters:
        - $ref: '#/components/parameters/TickerParam'
      responses:
        '200':
          description: Stock description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDescription'
              examples:
                sample:
                  value:
                    symbol: AAPL
                    companyName: Apple Inc.
                    ipoDate: '1980-12-12'
                    primaryExchange: XNAS
                    description: Consumer electronics and software company.
                    totalEmployees: 161000
                    sicCode: '3571'
                    sicDescription: Electronic Computers
                    marketCap: 2820000000000
                    weightedSharesOutstanding: 15500000000
        '500':
          $ref: '#/components/responses/InternalErrorText'
  /breadth/indicators:
    get:
      tags: [Breadth]
      summary: Get market breadth indicators
      deprecated: true
      description: |
        Alias for `/markets/us/massive/breadth/indicators`.
        Supports either date range (`start`,`end`) or trailing count (`days`).
        If `start` and `end` are present they are used; otherwise `days` (default `100`) is used.
      parameters:
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
      responses:
        '200':
          description: Breadth indicators sorted by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BreadthIndicators'
              examples:
                sample:
                  value:
                    - date: '2026-02-24'
                      day_4pct_up: 86
                      day_4pct_down: 41
                      qt_25pct_up: 312
                      qt_25pct_down: 97
                      monthly_25pct_up: 121
                      monthly_25pct_down: 66
                      monthly_50pct_up: 39
                      monthly_50pct_down: 18
                      bull_34_13: 211
                      bear_34_13: 83
        '400':
          $ref: '#/components/responses/BadRequestText'
        '500':
          $ref: '#/components/responses/InternalErrorText'
components:
  parameters:
    QuotesFormatParam:
      name: Accept
      in: header
      required: false
      schema:
        type: string
        enum: [application/json, text/csv]
        default: application/json
      description: Response format for quote history.
    CountryParam:
      name: country
      in: path
      required: true
      schema:
        type: string
      example: us
    ProviderParam:
      name: provider
      description: Configured profile key or legacy alias; actual providers are returned by GET /markets.
      in: path
      required: true
      schema:
        type: string
      example: massive
    TickerParam:
      name: ticker
      in: path
      required: true
      schema:
        type: string
      example: AAPL
  responses:
    BadRequestText:
      description: Validation error
      content:
        text/plain:
          schema:
            type: string
          examples:
            sample:
              value: Missing required query parameter tickers
    NotFoundText:
      description: Unknown market or missing resource
      content:
        text/plain:
          schema:
            type: string
          examples:
            sample:
              value: 'Unknown market: ro-bvb'
    InternalErrorText:
      description: Unexpected server error (stacktrace text)
      content:
        text/plain:
          schema:
            type: string
  schemas:
    ReportInput:
      type: object
      additionalProperties: false
      required: [title, markdown, asOf]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        markdown: {type: string, minLength: 1, maxLength: 900000}
        asOf: {type: string, format: date}
    MarketReport:
      type: object
      required: [id, title, markdown, asOf, createdAt]
      properties:
        id: {type: string}
        title: {type: string}
        markdown: {type: string}
        asOf: {type: string, format: date}
        createdAt: {type: string, format: date-time}
    PortfolioTrade:
      type: object
      additionalProperties: false
      required: [id, ticker, side, quantity, price, executedAt]
      properties:
        id: {type: string, pattern: '^[A-Za-z0-9_-]{1,100}$'}
        ticker: {type: string, minLength: 1, maxLength: 64}
        side: {type: string, enum: [buy, sell]}
        quantity: {type: number, exclusiveMinimum: true, minimum: 0, maximum: 1000000000}
        price: {type: number, exclusiveMinimum: true, minimum: 0, maximum: 1000000000}
        executedAt: {type: string, format: date-time}
        fees: {type: number, minimum: 0, maximum: 100000, default: 0}
        notes: {type: string, maxLength: 4000, default: ''}
    PortfolioPosition:
      type: object
      properties:
        ticker: {type: string}
        quantity: {type: number}
        averageEntryPrice: {type: number}
        costBasis: {type: number}
        currentPrice: {type: number}
        quoteDate: {type: string, nullable: true, format: date}
        priceSource: {type: string, enum: [close, last_fill]}
        marketValue: {type: number}
        unrealizedPnl: {type: number}
    PortfolioView:
      type: object
      properties:
        currency: {type: string, enum: [RON, USD, CAD]}
        initialCapital: {type: number}
        cash: {type: number}
        equity: {type: number}
        marketValue: {type: number}
        realizedPnl: {type: number}
        unrealizedPnl: {type: number}
        totalPnl: {type: number}
        returnPercent: {type: number}
        positions:
          type: array
          items: {$ref: '#/components/schemas/PortfolioPosition'}
        trades:
          type: array
          items: {$ref: '#/components/schemas/PortfolioTrade'}
        history:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              equity: {type: number}
    AppStatus:
      type: object
      required: [status, mongo, web, cron, jobs]
      properties:
        status:
          type: string
        mongo:
          type: string
        web:
          type: string
        cron:
          type: string
        jobs:
          type: array
          items:
            type: object
            required: [name, running]
            properties:
              name:
                type: string
                example: quotes:us-massive
              running:
                type: boolean
              lastSuccess:
                type: string
              lastError:
                type: string
    Quote:
      type: object
      required: [day, o, h, l, c, v]
      properties:
        day:
          type: string
          format: date
        o:
          type: number
          format: double
        h:
          type: number
          format: double
        l:
          type: number
          format: double
        c:
          type: number
          format: double
        v:
          type: integer
    DailyQuoteData:
      type: object
      required: [quotes]
      properties:
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
    AnnualFinancialData:
      type: object
      required: [year, revenuePerShare, basicEarningsPerShare, operatingMargin, netIncomeMargin]
      properties:
        year:
          type: integer
        revenuePerShare:
          type: number
          format: double
        basicEarningsPerShare:
          type: number
          format: double
        operatingMargin:
          type: number
          format: double
        netIncomeMargin:
          type: number
          format: double
    QuarterlyFinancialData:
      type: object
      required: [quarter, year, revenuePerShare, basicEarningsPerShare, netIncomeMargin, operatingMargin]
      properties:
        quarter:
          type: integer
        year:
          type: integer
        revenuePerShare:
          type: number
          format: double
        basicEarningsPerShare:
          type: number
          format: double
        netIncomeMargin:
          type: number
          format: double
        operatingMargin:
          type: number
          format: double
    StockFinancials:
      type: object
      required: [ticker, annual, quarterly]
      properties:
        ticker:
          type: string
        annual:
          type: array
          items:
            $ref: '#/components/schemas/AnnualFinancialData'
        quarterly:
          type: array
          items:
            $ref: '#/components/schemas/QuarterlyFinancialData'
    WatchlistSummary:
      type: object
      required: [name, symbolCount]
      properties:
        name:
          type: string
        symbolCount:
          type: integer
    WatchlistHistoryEntry:
      type: object
      required: [day, watchlists]
      properties:
        day:
          type: string
          format: date
        watchlists:
          type: array
          items:
            $ref: '#/components/schemas/WatchlistSummary'
    ScreenStats:
      type: object
      required: [ticker, stats]
      properties:
        ticker:
          type: string
        stats:
          type: object
          description: >
            Newly generated VCP watchlists only include tickers that pass SEPA
            for the same market and date, ordered by descending IBD rank.
            In VCP stats, pivot and support are the reference prices of the last
            contraction's high and low. volumeDryUp records whether volume dried
            up near the right edge. swingPoints is a JSON-encoded array of
            [ISO date, price] pairs in chronological order. It alternates the
            detected highs and lows, including earlier swings in the same
            base, with an optional final recovery point at
            the highest close after the last low through the watchlist snapshot.
            baseDrawdownPct is the maximum close-to-close peak-to-trough
            drawdown across the full base, expressed as a percentage.
            Stats values are strings.
          additionalProperties:
            type: string
    IncomePeriod:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
        currency:
          type: string
        revenue:
          type: number
        netIncome:
          type: number
        netMarginPct:
          type: number
        eps:
          type: number
    Watchlist:
      type: object
      required: [day, screenName, tickers, stats]
      properties:
        day:
          type: string
          format: date
        generatedAt:
          type: string
          format: date-time
          description: UTC generation time, omitted for older watchlists
        screenName:
          type: string
        tickers:
          type: array
          items:
            type: string
        stats:
          type: array
          items:
            $ref: '#/components/schemas/ScreenStats'
    ChartLabel:
      type: object
      required: [companyName, sector]
      properties:
        companyName:
          type: string
        sector:
          type: string
          description: SIC description when available; otherwise an empty string.
    MarketProfile:
      type: object
      required: [id, country, provider, label, title, sources, hasFinancials, aliases]
      properties:
        id: { type: string, example: us-alpaca }
        country: { type: string, example: us }
        provider: { type: string, example: alpaca }
        label: { type: string, example: 'US · Alpaca + Finnhub' }
        title: { type: string }
        hasFinancials: { type: boolean }
        aliases:
          type: array
          items: { type: string }
        sources:
          type: object
          required: [prices, listings, financials, metadata]
          properties:
            prices: { type: string, example: alpaca }
            listings: { type: string, example: finnhub }
            financials: { type: string, example: finnhub }
            metadata: { type: string, example: massive }
    StockDescription:
      type: object
      required:
        - symbol
        - companyName
        - ipoDate
        - primaryExchange
        - description
        - totalEmployees
        - sicCode
        - sicDescription
        - marketCap
        - weightedSharesOutstanding
      properties:
        symbol:
          type: string
        companyName:
          type: string
        ipoDate:
          type: string
          format: date
        primaryExchange:
          type: string
        description:
          type: string
        totalEmployees:
          type: integer
        sicCode:
          type: string
        sicDescription:
          type: string
        marketCap:
          type: integer
          format: int64
        weightedSharesOutstanding:
          type: integer
          format: int64
    BreadthIndicators:
      type: object
      required:
        - date
        - day_4pct_up
        - day_4pct_down
        - qt_25pct_up
        - qt_25pct_down
        - monthly_25pct_up
        - monthly_25pct_down
        - monthly_50pct_up
        - monthly_50pct_down
        - bull_34_13
        - bear_34_13
      properties:
        date:
          type: string
          format: date
        day_4pct_up:
          type: integer
        day_4pct_down:
          type: integer
        qt_25pct_up:
          type: integer
        qt_25pct_down:
          type: integer
        monthly_25pct_up:
          type: integer
        monthly_25pct_down:
          type: integer
        monthly_50pct_up:
          type: integer
        monthly_50pct_down:
          type: integer
        bull_34_13:
          type: integer
        bear_34_13:
          type: integer
