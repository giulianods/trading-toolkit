<div class="controls">
  <label for="watchlist-select">Watchlist:</label>
  <select id="watchlist-select" [value]="selectedWatchlist" (change)="onWatchlistChange($event)">
    <option *ngFor="let watchlist of watchlists" [value]="watchlist.value">
      {{ watchlist.label }}
    </option>
  </select>
</div>

<div class="charts">
  <div
    class="stock"
    *ngFor="let s of symbols; let i = index"
    [class.focused]="focusedIndex === i"
    tabindex="0"
    #stockCard
  >
    <div class="description" *ngIf="descriptions[s]">
      <h2>[{{ s }}] {{ descriptions[s].companyName }}</h2>
      <p class="sic">{{ descriptions[s].sicDescription }}</p>
      <p>{{ descriptions[s].description }}</p>
    </div>
    <img [src]="chartUrl(s)" [alt]="s">
    <div class="stats-table" *ngIf="stats[s]">
      <table>
        <tbody>
          <tr *ngFor="let stat of getStatsArray(s)">
            <td class="stat-key">{{ stat.key }}</td>
            <td class="stat-value">{{ stat.value }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
